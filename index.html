<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sandronelog — Verilog block visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark">sandrone<b>log</b></span><span class="ver" id="ver">v0.1</span><span class="sub">verilog blocks</span></div>
    <div class="spacer"></div>
    <div class="zoomctl"><button id="zoomOut" title="Zoom out">−</button><span class="z" id="zoomLbl">100%</span><button id="zoomIn" title="Zoom in">+</button></div>
    <button class="btn ghost" id="fitBtn" title="Reset view">Fit</button>
    <button class="iconbtn" id="themeBtn" title="Toggle theme"></button>
    <button class="btn ghost" id="loadBtn" title="Load a saved .json design">Load</button>
    <button class="btn ghost" id="saveBtn" title="Save design as .json">Save</button>
    <button class="btn primary" id="svBtn">SystemVerilog</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </header>
  <div class="main">
    <aside class="palette" id="palette" aria-label="Block palette"></aside>
    <div class="workarea">
      <div class="tabbar" id="tabbar" aria-label="Open module tabs"></div>
      <div class="canvas" id="canvas">
        <div class="world" id="world"><svg class="wires" id="wires"></svg></div>
        <div class="drop-hint">Release to place a block here</div>
        <div class="tpanel" id="tpanel">
          <div class="tphead" id="tphead"><span class="ti">Top-level ports</span><span class="tc" id="tpCount">0</span><span class="chev">▾</span></div>
          <div class="tpbody" id="tpbody"></div>
          <div class="tpadd"><button data-addtp="input">+ input</button><button data-addtp="output">+ output</button></div>
        </div>
      </div>
      <!-- Console and Waveform bottom panel -->
      <div class="output-panel collapsed" id="outputPanel">
        <div class="op-head" id="opHead">
          <span class="op-title">Simulation Output & Waves</span>
          <div class="spacer"></div>
          <button class="op-close" id="closeOutput" title="Toggle panel">▴</button>
        </div>
        <div class="op-tabs" id="opTabs">
          <button class="op-tab-btn active" data-tab="logs">Console Logs</button>
          <button class="op-tab-btn" data-tab="waves">Waveforms</button>
        </div>
        <div class="op-body">
          <div class="op-tab-content active" id="opLogs">
            <pre class="op-console" id="consoleOut">Click "Compile & Run" in the SystemVerilog panel to execute...</pre>
          </div>
          <div class="op-tab-content" id="opWaves">
            <div class="wave-viewer-container" id="waveContainer">
              <canvas id="waveCanvas" width="800" height="200"></canvas>
              <div class="wave-empty" id="waveEmpty">No simulation waves generated yet. Write initial stimulations in your top.sv block to create VCD files.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <aside class="dock" id="dock">
      <div class="dockhead">
        <div class="dockmode" id="dockMode"><button data-mode="module" class="on">Module</button><button data-mode="full">Full .sv</button></div>
        <span class="dtitle" id="dockTitle">top.sv</span>
        <div class="spacer"></div>
        <button class="mini" id="closeDock" title="Hide panel">Hide</button>
      </div>
      <div class="svwrap">
        <div class="editor" id="editor">
          <pre class="sv locked" id="genHead"></pre>
          <textarea class="sv edit" id="hdlEdit" spellcheck="false" placeholder="// your SystemVerilog for this module — appended before endmodule"></textarea>
          <pre class="sv locked" id="genTail"></pre>
        </div>
        <pre class="sv full" id="svOut"></pre>
      </div>
      <div class="statline" id="statline"></div>
      <div class="dockfoot"><input class="fname" id="fname" value="top.sv" spellcheck="false"><button class="btn" id="copyBtn">Copy</button><button class="btn primary" id="runBtn" title="Compile and Run simulation on backend">Compile & Run</button><button class="btn" id="dlBtn">Download</button></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
